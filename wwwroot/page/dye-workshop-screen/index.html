<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>华越印染染色车间</title>
  <link rel="stylesheet" href="./css/screen.css">
</head>
<body>
  <div class="screen">
    <header class="header">
      <div class="header__plate header__plate--time">
        <span class="header__plate-edge" aria-hidden="true"></span>
        <span id="clock">--</span>
      </div>
      <!-- 修改内容：标题绝对居中，右侧装饰条单独成组 -->
      <div class="header__plate header__plate--title">
        <span class="header__plate-edge" aria-hidden="true"></span>
        <span class="header__title-text">华越印染染色车间</span>
      </div>
      <div class="header__right">
        <div class="header__plate header__plate--side" aria-hidden="true">
          <span class="header__plate-edge" aria-hidden="true"></span>
        </div>
      </div>
      <!-- <div class="header__spacer" aria-hidden="true"></div>
      <div class="header__plate header__plate--title">...</div>
      <div class="header__plate header__plate--side">...</div> -->
      <button type="button" class="header__settings" id="btnSettings" title="设置" aria-label="设置">
        <svg class="header__settings-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7.2 7.2 0 0 0-1.62-.94l-.36-2.54A.48.48 0 0 0 14 2h-4a.48.48 0 0 0-.48.41l-.36 2.54c-.59.24-1.13.55-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.65 8.87a.49.49 0 0 0 .12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94L2.77 14.52a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.39.3.59.22l2.39-.96c.5.39 1.03.71 1.62.94l.36 2.54c.05.24.25.41.48.41h4c.23 0 .43-.17.48-.41l.36-2.54c.59-.24 1.13-.55 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/>
        </svg>
      </button>
      <div class="header__rail" aria-hidden="true">
        <span class="header__rail-flow"></span>
        <span class="header__rail-flow header__rail-flow--rev"></span>
      </div>
    </header>

    <main class="board" id="board" style="--cols: 1"></main>
  </div>

  <script src="./js/bg-fx.js"></script>
  <!-- 三个可复用组件：标题 / 克重 / 卡片 + 设置 -->
  <script src="./js/components/util.js"></script>
  <script src="./js/components/machine-title.js"></script>
  <script src="./js/components/machine-capacity.js"></script>
  <script src="./js/components/task-card.js"></script>
  <script src="./js/components/settings-panel.js"></script>
  <script src="./js/screen.js"></script>
</body>
</html>
