<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>代码编辑器</title>
    <script src="/lib/monaco/loader.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        #editorContainer { width: 100vw; height: 100vh; }
        #consoleContainer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100vw;
            z-index: 999;
            border-top: 1px solid #343434;
        }
        #consoleHeader {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 28px;
            padding: 0 8px 0 12px;
            background: #1e1e1e;
            border-bottom: 1px solid #343434;
            color: #ccc;
            font-size: 12px;
        }
        #consoleCloseBtn {
            width: 22px;
            height: 22px;
            border: none;
            background: transparent;
            color: #ccc;
            font-size: 16px;
            cursor: pointer;
        }
        #consoleCloseBtn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
        }
        #consoleOutput {
            height: 120px;
            background: #171717;
            font-family: Monaco, Consolas, monospace;
            font-size: 13px;
            overflow-y: auto;
            padding: 8px 10px;
            scrollbar-color: #555 #171717;
        }
   
    </style>
</head>
<body>
    <div id="editorContainer"></div>
    <div id="consoleContainer" style="display:none">
        <div id="consoleHeader">
            <span>控制台</span>
            <button type="button" id="consoleCloseBtn" title="关闭控制台" aria-label="关闭控制台">×</button>
        </div>
        <div id="consoleOutput"></div>
    </div>

<script>
// 子页面：完全由父页面控制 lang + code，自己不写死任何默认值
require.config({ 
    paths: {
        'vs': '/lib/monaco',
        'monaco-cshtml': '/js/monaco-cshtml'
    },
    'vs/nls': {
        availableLanguages: {
            '*': 'zh-cn'
        }
    }
});

require(['vs/editor/editor.main', 'monaco-cshtml'], function (_, MonacoCshtml) {

    let editor = null;
    let currentLang = "";
    let cshtmlRegistered = false;
    let suppressDirty = false;

    const consoleContainer = document.getElementById('consoleContainer');
    const consoleOutput = document.getElementById('consoleOutput');
    const consoleCloseBtn = document.getElementById('consoleCloseBtn');

    consoleCloseBtn.addEventListener('click', function () {
        consoleContainer.style.display = 'none';
    });

    function notifyDirty() {
        if (suppressDirty) return;
        window.parent.postMessage({ type: 'EDITOR_DIRTY' }, '*');
    }

    // 注册 cshtml：Razor + HTML，并在 <script>/<style> 内嵌入 JS/CSS 高亮
    function registerCshtmlLanguage() {
        if (cshtmlRegistered) return;
        MonacoCshtml.registerCshtmlLanguage(monaco);
        cshtmlRegistered = true;
    }

    // 主题/语言映射（只放配置，不放代码）
    const configMap = {
        cshtml: { theme: 'vs', fontSize: 14 },
        csharp: { theme: 'vs', fontSize: 14 }
    };
    const languageMap = {
        cshtml: 'cshtml',
        csharp: 'csharp'
    };

    // 对外暴露：父页面调用这个方法 → 切换语言+设置代码
    window.setEditorLangAndCode = function (newLang, code) {
        currentLang = newLang;
        if (newLang === 'cshtml') {
            registerCshtmlLanguage();
        }
        const editorLang = languageMap[newLang] || newLang;
        const conf = configMap[newLang] || { theme: 'vs-dark', fontSize: 14 };

        suppressDirty = true;
        if (!editor) {
            // 首次初始化
            editor = monaco.editor.create(document.getElementById('editorContainer'), {
                value: code || "",
                language: editorLang,
                ...conf,
                automaticLayout: true,
            });
            editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS, function () {
                window.parent.postMessage({ type: 'SAVE_CODE' }, '*');
            });
            editor.onDidChangeModelContent(notifyDirty);
        } else {
            editor.updateOptions(conf);
            // 后续切换：只改model和配置
            const model = monaco.editor.createModel(code || "", editorLang);
            editor.setModel(model);
        }
        setTimeout(function () { suppressDirty = false; }, 0);
    };

    // 对外暴露：父页面拿当前编辑器代码
    window.getEditorContent = function () {
        return editor ? editor.getValue() : "";
    };
    window.parent.postMessage({ type: 'EDITOR_READY' }, '*');
    // 监听父页面发来的消息
    window.addEventListener('message', function(e) {
        const msg = e.data;
        switch(msg.type) {
            case "RUN_CODE":
                consoleOutput.textContent = '';
                consoleContainer.style.display = 'block';
                consoleOutput.innerHTML = `<span style="color:#e3c468;">暂不支持C#代码直接运行，请接入后端服务。</span>`;
                break;
            case "CLEAR_CONSOLE":
                consoleOutput.textContent = '';
                break;
            case "OPEN_CONSOLE":
                consoleContainer.style.display = 'block';
                break;
        }
   
    });
});
</script>
</body>
</html>
