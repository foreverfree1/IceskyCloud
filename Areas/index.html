  :where(button, input:not([type=checkbox]):not([type=radio]), select, textarea) {

  :where(input[type=checkbox], input[type=radio]) { accent-color: var(--finance-focus) !important; }

  :where(input, textarea)[readonly] { background-color: var(--finance-neutral) !important; }
  :where(button, input, select, textarea):disabled {
    background-color: var(--finance-neutral) !important;

  }
  :where(button:not(:disabled), nav a):hover { background-color: var(--finance-neutral) !important; }

  :where(.table-wrap, .wrap, .table-scroll, .query-region, .related-scroll, .grid-wrap) {

  }

22.5h13%22%20fill%3D%22none%22%20stroke%3D%22%23ffffff%22%20stroke-width%3D%222.4%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E\">\n\u003cmeta name=\"theme-color\" content=\"#169bff\">\n\u003cstyle>\n/* ==== style.css ==== */\n*{box-sizing:border-box}html,body{margin:0;height:100%;font:12px \"Microsoft YaHei\",Arial,sans-serif;color:#333;background:#f2f2f2}body{display:flex;flex-direction:column}button,input,select{font:inherit;color:inherit}button{height:27px;border:1px solid #ccc;border-radius:3px;background:linear-gradient(#fff,#fafafa);padding:0 10px;cursor:pointer;white-space:nowrap}button:hover:not(:disabled){border-color:#13b7ac;color:#079d94}button:disabled{color:#bbb;cursor:default;background:#fafafa;border-color:#e5e5e5}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #13b7ac;outline-offset:1px}.tabs{height:34px;display:flex;background:white;border-bottom:1px solid #e5e5e5;flex-shrink:0}.tabs a,.tabs span{padding:8px 22px;border-right:1px solid #eee;text-decoration:none;color:#777}.tabs .active{color:#338eed}.tabs i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#338eed;margin-right:9px}.toolbar{display:flex;align-items:center;gap:5px;margin:6px 5px;padding:5px;background:#fff;border:1px solid #e5e5e5;border-radius:4px;flex-shrink:0;flex-wrap:wrap}.record-picker{margin-left:auto;display:flex;align-items:center;gap:8px}.record-picker select{width:190px;height:28px;border:1px solid #e5e5e5}#save-state{color:#07877f;margin-left:10px}main{margin:0 5px 5px;padding:10px;background:white;border-radius:4px;display:flex;flex-direction:column;flex:1;min-height:0}.master-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px 14px;padding-bottom:6px}.field{display:flex;align-items:center;min-width:0;gap:9px}.field>span{width:100px;flex-shrink:0;text-align:right;white-space:nowrap}.field input,.field select{width:100%;min-width:0;height:29px;border:1px solid #e5e5e5;background:#fff;padding:4px 9px;border-radius:1px}.field input[readonly]{background:#fafafa;color:#666}em{font-style:normal;color:#f04444}#error{color:#d73535;line-height:24px}#error:empty{display:none}.tables-viewport{flex:1;min-height:290px;overflow:auto}.detail-grid{display:grid;grid-template-columns:minmax(416px,1fr) minmax(180px,.43fr) minmax(450px,1.43fr);min-width:1046px;height:100%;min-height:290px}.detail-panel{border:1px solid #e5e5e5;min-width:0;display:flex;flex-direction:column}.detail-panel+.detail-panel{border-left:0}.detail-toolbar{min-height:35px;padding:4px;display:flex;align-items:center;gap:4px;background:#f2f2f2;border-bottom:1px solid #e5e5e5}.detail-toolbar strong{font-weight:400;margin-left:auto;color:#777;padding-right:5px}.add{background:#13b7ac;color:white;border:0}.add:hover:not(:disabled){background:#10a89f;color:white}.table-scroll{overflow:auto;flex:1;min-height:180px}table{border-collapse:collapse;table-layout:fixed;width:100%;font-size:12px}.check-col{width:30px}th{height:31px;background:#f2f2f2;color:#555;font-weight:400;white-space:nowrap}td,th{border-right:1px solid #e5e5e5;border-bottom:1px solid #e5e5e5;padding:4px 5px}th:last-child,td:last-child{border-right:0}td{height:34px}td input:not([type=checkbox]),td select{width:100%;min-width:0;border:1px solid transparent;background:transparent;height:25px;padding:2px 3px;border-radius:1px}td input:not([type=checkbox]):hover,td select:hover{border-color:#ccc}td .number{text-align:right;font-variant-numeric:tabular-nums}td:first-child{text-align:center}input[type=checkbox]{accent-color:#13b7ac;cursor:pointer}.selected td{background:#eaf8f6}.selected td:nth-child(2){box-shadow:inset 3px 0 #13b7ac}.empty td{text-align:center;color:#999;height:110px}.parent-context{height:27px;padding:5px 9px;color:#07877f;background:#f5fbfa;border-bottom:1px solid #e5e5e5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.detail-panel:nth-child(3) .detail-toolbar{border-bottom:0}input[aria-invalid=true],select[aria-invalid=true]{border:1px solid #d73535!important;background:#fff6f6!important}#closed{margin:auto;text-align:center;color:#888}[hidden]{display:none!important}@media(max-width:1200px){.master-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){.master-grid{grid-template-columns:1fr}.record-picker{margin-left:0}.field>span{width:98px}main{overflow:auto}.tables-viewport{flex:none;height:360px}.toolbar{gap:5px}#save-state{width:100%;margin:0}.record-picker select{width:180px}}\r\n\r\n/* 主表按业务关系四列排列，长文本加宽；窄屏逐级减少列数。 */\r\n.master-grid{gap:10px 20px;padding:12px 10px 14px;margin:0 0 12px;border-bottom:1px solid #e5e5e5;flex-shrink:0}\r\n.master-grid .field{gap:8px}.master-grid .field>span{width:88px}\r\n.master-grid .field input,.master-grid .field select{height:30px;border-radius:3px}\r\n.master-grid .field-wide{grid-column:span 2}\r\n@media(max-width:1200px){.master-grid{gap:10px 16px;padding:10px 4px 12px}}\r\n@media(max-width:650px){.master-grid{gap:9px;padding:8px 0 12px}.master-grid .field-wide{grid-column:span 1}.master-grid .field>span{width:88px}}\r\n\r\n.detail-panel .detail-toolbar button{padding-inline:9px}\r\n.detail-panel .detail-toolbar strong{white-space:nowrap}\r\n.detail-panel :is(th,td):first-child:not([colspan]){padding-inline:0;text-align:center!important}\r\n.detail-panel input[type=checkbox]{margin:0;vertical-align:middle}\r\n#lines .exec-price-col,#lines col:last-child{width:72px}\r\n#lines .rate-col{width:76px}\r\n#fastness .fastness-col{width:53%}\r\n#cards .card-no-col{width:126px}\r\n#cards .card-color-no-col{width:78px}\r\n#cards .card-color-no{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\r\n#cards .card-replace{margin-left:4px;padding:0 3px;height:22px;min-height:0;font-size:12px}\r\n.master-grid .contract-trigger input:not(.can-select){padding-right:7px}\r\n#contract-table th:first-child{width:30px}\r\n#cards .piece-count-col{width:56px}\r\n#cards .card-piece-count{font-variant-numeric:tabular-nums}\r\n#cards .price-col{width:76px}\r\n#cards .pack-price-col{width:90px}\r\n.toolbar-context{display:flex;align-items:center;gap:8px 14px;margin-left:auto;flex-wrap:wrap;max-width:100%}\r\n.toolbar-context .record-picker{margin-left:0}\r\n.role-picker{display:flex;align-items:center;gap:8px;white-space:nowrap}\r\n.role-picker select{height:28px;padding:2px 8px;min-width:86px;border:1px solid #dbe7f4}\r\n.workflow-state{padding:4px 8px;border-radius:3px;white-space:nowrap;background:#eef2f6;color:#56708b}\r\n.workflow-state[data-state=pending]{background:#fff4d9;color:#805500}\r\n.workflow-state[data-state=approved]{background:#e4f6ec;color:#235f46}\r\n@media(max-width:650px){.toolbar-context{margin-left:0}.toolbar #save-state:empty{display:none}}\r\n.contract-trigger{position:relative;flex:1;min-width:0}\r\n.master-grid .field .contract-trigger input{padding-right:29px}\r\n.master-grid .contract-trigger input.can-select{cursor:pointer;background:#fff!important}\r\n.contract-trigger button{position:absolute;inset:1px 1px 1px auto;width:27px;height:auto;min-height:0;padding:0;border:0;border-left:1px solid var(--finance-grid,#d2d2d2);border-radius:0 2px 2px 0}\r\n.contract-picker{position:fixed;inset:auto;margin:0;width:min(520px,calc(100vw - 16px));max-height:calc(100dvh - 16px);padding:0;border:1px solid var(--finance-rule,#aaa);border-radius:3px;box-shadow:0 4px 16px #0003}\r\n.contract-picker:popover-open{display:flex;flex-direction:column}\r\n.contract-search-bar,.contract-picker-actions{display:flex;align-items:center;gap:6px;padding:7px;flex-shrink:0}\r\n.contract-search-bar{border-bottom:1px solid var(--finance-grid,#d2d2d2)}\r\n.contract-search-bar input{width:100%;min-width:0;border:1px solid var(--finance-grid,#d2d2d2)}\r\n.contract-table-scroll{min-height:0;max-height:min(216px,48dvh);overflow:auto}\r\n.contract-table-scroll table{min-width:452px}\r\n.contract-table-scroll th,.contract-table-scroll td{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\r\n.contract-table-scroll th{position:sticky;top:0;z-index:1}\r\n.contract-table-scroll :is(th,td):first-child{padding:0;text-align:center!important}\r\n#contract-table input[type=radio]{width:14px;height:14px;padding:0;margin:0;vertical-align:middle;accent-color:var(--finance-focus,#536a7d)}\r\n.contract-table-scroll tr[data-option]{cursor:pointer}\r\n.contract-picker-actions{border-top:1px solid var(--finance-grid,#d2d2d2);justify-content:flex-end}\r\n.detail-grid{grid-template-columns:minmax(416px,1fr) clamp(146px,12%,166px) minmax(450px,1.43fr);min-width:1012px}\r\n.detail-panel:nth-child(2) .detail-toolbar{gap:4px;padding-inline:4px}\r\n.detail-panel:nth-child(2) .detail-toolbar button{padding-inline:5px}\r\n#fastness .check-col{width:25px}\r\n#fastness .fastness-col{width:auto}\r\n#fastness .level-col{width:52px}\r\n#cards button.card-link{border:0;padding:0;min-height:0;height:auto;text-decoration:underline;text-underline-offset:2px;color:#2f566c!important;background:transparent!important}\r\n#cards td[data-fill-key]{position:relative}\r\n#cards td[data-fill-key] input{padding-right:10px}\r\n.card-fill-handle{position:absolute;right:2px;bottom:2px;width:8px;height:8px;display:none;border:1px solid #fff;background:#51697b!important;cursor:crosshair;touch-action:none}\r\n#cards td[data-fill-key]:hover .card-fill-handle,#cards td[data-fill-key]:focus-within .card-fill-handle{display:block}\r\n#cards td.card-fill-target{outline:2px solid #536a7d;outline-offset:-2px;background:#eaf0f4!important}\r\n#card-fill-menu{inset:auto;margin:0;padding:3px;border:1px solid #aaa;background:#fff!important;box-shadow:0 3px 12px #0003}\r\n#card-fill-menu button{width:100%}\r\n#card-action-dialog{width:min(560px,calc(100vw - 20px));max-height:calc(100dvh - 20px);border:1px solid #aaa;padding:0;border-radius:3px}\r\n#card-action-dialog::backdrop{background:rgb(23 33 43 / 36%)}\r\n#card-action-form{display:flex;flex-direction:column;max-height:calc(100dvh - 24px)}\r\n.card-action-head,.card-action-foot{padding:9px 12px;flex-shrink:0}\r\n.card-action-head{border-bottom:1px solid #ddd;font-size:14px}\r\n.card-action-foot{display:flex;justify-content:flex-end;gap:6px;border-top:1px solid #ddd}\r\n#card-action-content{padding:10px 12px;overflow:auto;min-height:0}\r\n#card-action-error:not(:empty){padding:0 12px 8px}\r\n.card-details,.card-fill-form{display:grid;gap:8px 14px;grid-template-columns:repeat(2,minmax(0,1fr));margin:0}\r\n.card-details>div,.card-fill-form label{display:grid;gap:4px;min-width:0}\r\n.card-details>div:nth-last-child(-n+2),.card-fill-preview{grid-column:1/-1}\r\n.card-details dd{margin:0;min-height:26px;padding:4px 6px;border:1px solid #d2d2d2;overflow-wrap:anywhere}\r\n.card-fill-form :is(input,select){width:100%;min-width:0;border:1px solid #d2d2d2}\r\n.card-fill-preview{margin:2px 0}\r\n.card-choices{display:grid;gap:6px}\r\n.card-choices label{padding:4px;border-bottom:1px solid #ddd;cursor:pointer}\r\n.card-choices input[type=radio]{width:14px;height:14px;vertical-align:middle}\r\n\n\u003c/style>\u003cstyle>\n/* ==== review.css ==== */\n/* 价格变更 · 调价评审版\n   审批条移到主表之后：上排是调价与合计，下排是审批意见和驳回/同意。\n   明细三表在下方占满剩余高度。强调色需覆盖财务白底主题的 !important 归一。 */\n\n/* 三表比例：价格明细 8 列，流程卡价格 10 列（含备注）。 */\n.detail-grid{grid-template-columns:498px 146px minmax(660px,1fr);min-width:1304px}\n.tables-viewport{min-height:300px}\n\n/* 主表压缩纵向间距，把高度让给明细表。 */\n.master-grid{gap:7px 20px;padding:9px 10px 10px;margin-bottom:8px}\n\n/* ---------- 调价摘要条（主表之后） ---------- */\n.approval-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:31px;margin:0 10px 8px;padding:4px 9px;border:1px solid #dbe7f4;background:#fbfcff;flex-shrink:0}\n.approval-totals{font-size:12px;line-height:18px;color:#33506f!important;display:flex;flex-wrap:wrap;align-items:baseline}\n.approval-totals b{font-variant-numeric:tabular-nums;font-weight:600}\n.approval-totals .neg{color:#b42318!important}\n.approval-totals .pos{color:#1b6b45!important}\n.sum{display:inline-flex;align-items:baseline;gap:5px;padding:0 12px;border-left:1px solid #e6eef7}\n.sum:first-child{border-left:0;padding-left:0}\n.sum:last-child{padding-right:0}\n.sum i{font-style:normal;font-size:11px;color:#7b93b1!important}\n.sum b{font-weight:600;font-variant-numeric:tabular-nums}\n.sum .unit{font-size:11px;color:#8ba4c0!important}\n.sum .arrow{color:#9fb3c9!important}\n.approval-flow{margin-left:auto;font-size:11px;color:#7b93b1!important;white-space:nowrap}\n.approval-flow b{font-weight:400}\n.approval-flow .done{color:#2f8a5f!important}\n.approval-flow .now{color:#b54708!important;font-weight:600}\n.approval-flow .rejected{color:#b42318!important;font-weight:600}\n.audit-hint{font-size:11px;color:#b42318!important;white-space:nowrap}\n.audit-hint:empty{display:none}\n\n/* 审批意见：接在调价摘要条之后，独占一行，标签与输入框和上方字段同列对齐。 */\n.audit-row{margin:0 10px 8px;flex-shrink:0}\n.audit-row .field{gap:8px;min-height:28px}\n.audit-row .field>span{width:88px;flex-shrink:0;text-align:right;white-space:nowrap;color:#5a7da6}\n.audit-row .field input{flex:1;min-width:0;height:28px}\n\n/* 状态徽标：主题会清空底色，这里用 !important 恢复业务状态色。 */\n.workflow-state[data-state=pending]{background:#fff4d9!important;color:#8a5a00!important;border:1px solid #f0d09a;border-radius:3px;padding:2px 8px}\n.workflow-state[data-state=approved]{background:#e6f6ec!important;color:#1b6b45!important;border:1px solid #b5ddc7;border-radius:3px;padding:2px 8px}\n.workflow-state[data-state=rejected]{background:#fdecea!important;color:#b42318!important;border:1px solid #f0b4ae;border-radius:3px;padding:2px 8px}\n.workflow-state[data-state=draft]{background:#f1f4f8!important;color:#5b7398!important;border:1px solid #dbe7f4;border-radius:3px;padding:2px 8px}\n\n/* ---------- 表格内的原价、变动、增减额 ---------- */\n.detail-toolbar .unit-chip{height:18px;line-height:16px;padding:0 6px;border:1px solid #cfe3f6;border-radius:3px;font-size:11px;color:#2b6fa8!important;background:#f2f8ff!important}\n.detail-toolbar .parent-context{margin-left:auto;padding:0 4px;border:0;font-size:11px;color:#6b86a4!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}\ntd.calc{font-variant-numeric:tabular-nums;white-space:nowrap;padding-right:7px}\n.delta-neg{color:#b42318!important}\n.delta-pos{color:#1b6b45!important}\n.cell-flag{display:inline-block;margin-left:3px;padding:0 3px;border:1px solid #f0b4ae;border-radius:2px;background:#fef3f2!important;color:#b42318!important;font-size:10px;line-height:14px}\n/* 价格明细：颜色列自适应，其余固定，避免数值列被拉宽。 */\n#lines .color-col{width:80px}\n#lines .color-name-col{width:88px}\n#lines .component-col{width:78px}\n#lines .src-price-col{width:88px}\n#lines .exec-price-col{width:88px}\n/* 流程卡价格 10 列，压缩表头内边距并隐藏溢出，避免相邻表头文字挤压。 */\n#cards th{overflow:hidden;text-overflow:ellipsis;padding:6px 4px}\n#cards .weight-col{width:58px}\n#cards .card-no-col{width:104px}\n#cards .piece-count-col{width:50px}\n#cards .amount-col{width:82px}\n#cards .reason-col{width:150px}\n#cards .remark-col{width:132px}\r\n/* 合计行：加粗上边框与浅蓝底，和明细行区分。 */\n#cards tfoot td{border-top:2px solid #c6dafa!important;background:#f4f9ff!important;font-weight:600;color:#2d4f75!important}\n#cards tfoot td.calc{font-variant-numeric:tabular-nums}\n#cards .pack-price-col{width:66px}\n#cards .price-col{width:62px}\n/* 牢度表只有两列，压缩其操作行与列宽。 */\n.detail-panel:nth-child(2) .detail-toolbar{padding:3px 3px;gap:2px}\n.detail-panel:nth-child(2) .detail-toolbar button{padding:0 4px}\n.detail-panel:nth-child(2) .detail-toolbar strong{padding-right:2px;font-size:11px}\n#fastness th{padding:6px 4px}\n#fastness{min-width:148px}\n#cards td input[title]{text-overflow:ellipsis}\ntd input[readonly]{color:#4a6a8f!important}\n\n/* 未定价行整体提示，左侧红色标记条。 */\ntr.row-warn>td{background:#fff7f6!important}\ntr.row-warn>td:first-child{box-shadow:inset 2px 0 0 #e5484d}\n/* 本次调整过价格的流程卡，左侧橙色标记。 */\n#cards tr.row-adjusted>td{background:#fffdf4!important}\n#cards tr.row-adjusted>td:first-child{box-shadow:inset 2px 0 0 #e8a33d}\ntr.row-flash>td{animation:rowFlash 1.4s ease-out}\n@keyframes rowFlash{0%,40%{background:#dceeff!important}100%{background:transparent}}\n\n/* 窄屏时表格保持最小可读宽度，横向滚动留在表格容器内。 */\n#lines{min-width:440px}\n#cards{min-width:650px}\n\n.tabs .tab-note{margin-left:auto;border-right:0;padding:8px 14px;font-size:11px;color:#9bb0c8!important;background:transparent!important}\n\n@media(max-width:1350px){\n  .detail-grid{grid-template-columns:498px 146px minmax(600px,1fr);min-width:1244px}\n}\n@media(max-width:1040px){\n  .detail-grid{grid-template-columns:1fr;min-width:0}\n  .detail-panel+.detail-panel{border-left:1px solid #e5e5e5}\n  .approval-bar{margin:0 6px 6px}\n  .approval-flow{display:none}\n  .approval-note{order:3;flex-basis:100%}\n}\n@media(max-width:760px){\n  .approval-bar{padding:5px 7px}\n}\n\n\u003c/style>\n\u003cstyle id=\"finance-page-style\">\n/* 视觉基准沿用第1页；仅调整屏幕样式，保留字段、网格列数和业务区域布局。 */\n@media screen {\n  :root{--line:#dbe7f4;--blue:#169bff}\n  html,body{font-family:\"Microsoft YaHei\",Arial,sans-serif;font-size:12px;color:#466488;background:#fff}\n  button,input,select,textarea{font-family:inherit;font-size:12px;color:inherit}\n  button{min-height:27px;padding:0 12px;border-color:#d6e3f3;border-radius:2px;background:#fff}\n  button:hover:not(:disabled){color:#169bff;border-color:#9bcefa;background:#f5faff}\n  button.primary,.primary{background:#169bff;border-color:#169bff;color:#fff}\n  button.primary:hover:not(:disabled){background:#078ce9;color:#fff}\n  button:disabled{color:#b6c3d1;border-color:#e3ebf4;background:#fafcfe}\n  button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #169bff;outline-offset:1px}\n  input:not([type=checkbox]),select{height:26px;padding:2px 7px;border-color:#d6e3f3;border-radius:2px;background:#fff}\n  input::placeholder,textarea::placeholder{color:#a0b3cd}\n  input[readonly],textarea[readonly]{background:#fafcfe;border-color:#d6e3f3;color:#466488}\n  input:disabled,select:disabled{background:#f4f6f9;color:#a0b3cd}\n  input[type=checkbox]{accent-color:#169bff}\n  main{background:#fff}\n  header:not(.tabs){height:45px;min-height:45px;gap:12px}\n  header strong,header h1{font-size:14px;line-height:20px;color:#285584;font-weight:600}\n  header.tabs{height:45px;min-height:45px}\n  .toolbar{min-height:36px;padding:4px 8px;gap:6px;border-color:#dbe7f4;border-radius:0}\n  .form-box,.filters,#filters,.master-grid{row-gap:5px;padding-top:7px;padding-bottom:7px;border-color:#dbe7f4;border-radius:0}\n  .filters,#filters{background:#fbfcff}\n  .field{min-height:26px;gap:6px}\n  .field>span{font-size:12px;color:#5a7da6}\n  .field input:not([type=checkbox]),.field select,.master-grid .field input,.master-grid .field select{height:26px;padding:2px 7px;border-color:#d6e3f3;border-radius:2px}\n  .field input[readonly]{background:#fafcfe}\n  .form-box textarea{height:26px;min-height:26px;padding:2px 7px;line-height:20px;border-radius:2px}\n  .form-box .field.multiline{align-items:center}\n  .form-box .field.multiline>span{padding-top:0}\n  .tabs:not(header),.tabbar{height:36px;min-height:36px;gap:6px;background:#f5f8fc;border-color:#dbe7f4}\n  .tabs button,.tabbar button{min-height:27px;padding:0 12px;border-radius:2px;color:#6b87ac}\n  .tabs button.active,.tabbar button.active{background:#e9f5ff;color:#0094ff;border-color:#c6e5ff;font-weight:400}\n  .box,.tables,#panel,.detail-panel{border-color:#dbe7f4;border-radius:0}\n  .bar,.detail-toolbar{height:36px;min-height:36px;padding:3px 7px;background:#f5f8fc;border-color:#dbe7f4;color:#52759e;font-size:12px}\n  .detail-toolbar .add{background:#169bff;border-color:#169bff;color:#fff}\n  .detail-toolbar strong{color:#52759e}\n  .table-wrap,.wrap,.table-scroll,.query-region{scrollbar-width:thin;scrollbar-color:#c4d3e4 #f5f8fc}\n  table{font-size:12px}\n  th,td{padding:6px 9px;border-right-color:#e5edf7;border-bottom-color:#e5edf7}\n  th{height:38px;background:#eaf2fb;color:#52759e;font-weight:400;border-right-c ce-neutral) !important; }\n  :where(button, input, select, textarea):disabled {\n    background-color: var(--finance-neutral) !important;\n    color: var(--finance-disabled) !important;\n  }\n  :where(button:not(:disabled), nav a):hover { background-color: var(--finance-neutral) !important; }\n  :where(button.primary, .add, nav button.active, .tabs .active, .tabbar .active, .view-tabs .active,\n    [role=tab][aria-selected=true], button[aria-selected=true], button[aria-pressed=true],\n    .navigation [aria-current=page], .sidebar [aria-current=page]) {\n    background-color: var(--finance-selected) !important;\n    border-color: var(--finance-rule) !important;\n  }\n  :where(.navigation, .sidebar) [aria-current=page] { font-weight: 600; }\n  :where(.navigation, .sidebar) [aria-current=page]::before,\n  :where(.tabs i) { background-color: var(--finance-focus) !important; }\n\n  :where(table) { font-size: 12px !important; background-color: var(--finance-white) !important; }\n  :where(table) :is(th, td) { border-color: var(--finance-grid) !important; }\n  :where(th, tfoot td, td.is-frozen, td.row-actions, .query-region td:last-child) {\n    background-color: var(--finance-white) !important;\n  }\n  :where(thead) :is(th, th button) { font-weight: 600 !important; }\n  :where(th button, .link, .amount-link, td input:not([type=checkbox]), td select) {\n    background-color: transparent !important;\n  }\n  :where(table) :is(.link, .amount-link, a[href]) {\n    text-decoration: underline;\n    text-underline-offset: 2px;\n  }\n  tbody tr:hover:not(.empty):not(.blank):not(.blank-row):not(.subtotal) > td {\n    background-color: var(--finance-neutral) !important;\n  }\n  tbody tr:is(.selected, .row-selected, [aria-selected=true]) > td {\n    background-color: var(--finance-selected) !important;\n  }\n  tfoot td, tbody tr.subtotal, tbody tr.subtotal > td, #grid tbody tr.subtotal > td {\n    background-color: var(--finance-white) !important;\n    border-top-color: var(--finance-rule) !important;\n    font-weight: 600 !important;\n  }\n  :where(.table-wrap, .wrap, .table-scroll, .query-region, .related-scroll, .grid-wrap) {\n    scrollbar-color: #c4cbd1 #f4f4f4;\n  }\n\n  :where(dialog, .dialog)::backdrop,\n  .nav-open :is(#shade, .shade, #backdrop, .sidebar-backdrop) {\n    background-color: var(--finance-overlay) !important;\n  }\n  :where(#toast, .toast) { box-shadow: 0 2px 8px #0003; }\n  :where(.form-error, .error, #error, .missing-error, [role=alert], .required, .price-change-required) {\n    font-weight: 600;\n  }\n  :where(input, select, textarea)[aria-invalid=true] {\n    background-color: var(--finance-neutral) !important;\n    border-color: var(--finance-ink) !important;\n  }\n}\n\u003c/style>\u003cstyle>\nbody.shipment-editor :is(.sidebar,.sidebar-backdrop,.tabs){display:none!important}\nbody.shipment-editor .page-layout{overflow:auto;background:#fff}\nbody.shipment-editor #shipment-context-label{padding:0 7px;white-space:nowrap}\nbody.shipment-editor .toolbar{position:sticky;top:0;z-index:2}\nbody.shipment-editor #workspace{min-height:max-content;overflow:visible}\n.page-layout{flex:1;display:flex;flex-direction:column;height:100dvh;min-width:0}body{overflow:hidden}\u003c/style>\u003c/head>\n\u003cbody>\n\u003cdiv class=\"page-layout\">\n\u003cheader class=\"tabs\">\u003cspan class=\"active\">\u003ci>\u003c/i>价格变更\u003c/span>\u003c/header>\n\u003cdiv class=\"toolbar\">\n  \u003cbutton id=\"new\">新增\u003c/button>\u003cbutton id=\"edit\" disabled>修改\u003c/button>\u003cbutton id=\"save\" disabled>保存\u003c/button>\u003cbutton id=\"submit-change\" disabled>提交\u003c/button>\u003cbutton id=\"audit-withdraw\" disabled>撤销\u003c/button>\u003cbutton id=\"audit-change\" disabled>审核\u003c/button>\u003cbutton id=\"audit-reject\" disabled>驳回\u003c/button>\u003cbutton id=\"close\">关闭\u003c/button>\n  \u003cspan class=\"workflow-state\" id=\"workflow-state\" aria-live=\"polite\">\u003c/span>\u003cspan id=\"save-state\" role=\"status\">\u003c/sp box'||tr.dataset.line===selectedLineId)return;\r\n selectedLineId=tr.dataset.line;checked.cards.clear();\r\n // 先提交当前控件到草稿，再切换关联表，避免重新渲染时丢失输入和焦点。\r\n const focusKey=e.target.dataset.key;renderTables();if(focusKey)$('#lines [data-id=\"'+selectedLineId+'\"][data-key=\"'+focusKey+'\"]').focus();\r\n});\r\n$$('[data-add]').forEach(button=>button.onclick=()=>{\r\n if(!canEdit())return;\r\n const type=button.dataset.add,id=uid();showError();\r\n if(type==='lines'){draft.lines.push({F_Id:id,F_PrimaryId:draft.F_Id,F_ColorScheme:'',F_Color:'',F_Component:'',F_ExecPrice:'',F_Price:''});selectedLineId=id;checked.cards.clear();}\r\n if(type==='fastness')draft.fastness.push({F_Id:id,F_PrimaryId:draft.F_Id,F_Fastness:'',F_Level:''});\r\n if(type==='cards'){\r\n  openCardChoice();\r\n  return;\r\n }\r\n renderTables();modified();$('#'+type+' [data-id=\"'+id+'\"][data-key]')?.focus();\r\n});\r\n$$('[data-delete]').forEach(button=>button.onclick=()=>{\r\n if(!canEdit())return;\r\n const type=button.dataset.delete,ids=checked[type];\r\n if(type==='lines'&&draft.cardPrices.some(r=>ids.has(r.parentId))){showError('所选价格明细下有流程卡价格，请先删除对应的流程卡记录。');return;}\r\n if(type==='cards')draft.cardPrices=draft.cardPrices.filter(r=>!ids.has(r.F_Id));else draft[type]=draft[type].filter(r=>!ids.has(r.F_Id));\r\n if(!draft.lines.some(r=>r.F_Id===selectedLineId)){selectedLineId=draft.lines[0]?.F_Id;checked.cards.clear();}ids.clear();renderTables();modified();\r\n});\r\nconst numberOK=v=>/^\\d+(?:\\.\\d{1,4})?$/.test(String(v))&&Number.isFinite(Number(v))&&Number.isSafeInteger(Math.round(Number(v)*10000));\r\nfunction focusCardInput(row,key){\r\n if(row.parentId!==selectedLineId){selectedLineId=row.parentId;checked.cards.clear();renderTables();}\r\n return cellInput('cards',row.F_Id,key);\r\n}\r\nfunction validate(){\r\n $$('[aria-invalid]').forEach(e=>e.removeAttribute('aria-invalid'));\r\n const source=shipmentEntry?shipmentContext?.approval:contractOptions.find(row=>row.F_Id===sourceApprovalId());\r\n ，避免原因列变成空壳。\r\n   if(reason==='其他'&&!String(row.F_Remark??'').trim())return showError('变更原因选择“其他”时，请在备注中写明具体原因。',focusCardInput(row,'F_Remark'));\r\n  }\r\n }\r\n const pack=$('[data-field=\"F_ParkPrice\"]');if(pack.value.trim()&&!numberOK(pack.value.trim()))return showError('包装价格须为不小于0、最多4位小数的有效数字。',pack);\r\n return true;\r\n}\r\n/* ---------- 调价评审：取数、规则与渲染 ---------- */\r\nfunction priceUnit(){const card=availableCards().find(c=>c.details?.F_MaterialUnitName);return '元/'+(card?.details?.F_MaterialUnitName||'公斤');}\r\nfunction lineSrc(row){return toNum(row?.F_ExecPrice);}\r\nfunction lineNew(row){return toNum(row?.F_Price);}\r\nfunction pctOf(from,to){return from===null||to===null||!from?null:(to-from)/from*100;}\r\nfunction cardInfo(row){return availableCards().find(c=>c.id===row.cardId);}\r\nfunction cardWeight(row){return toNum(cardInfo(row)?.details?.F_Weight);}\r\nfunction lineOf(row){return draft.lines.find(l=>l.F_Id===row.parentId)||{};}\r\nfunction cardAdjusted(row){\r\n const src=lineSrc(lineOf(row)),price=toNum(row.price);\r\n return src!==null&&price!==null&&Math.abs(price-src)>0.00005;\r\n}\r\nfunction cardDelta(row){const src=lineSrc(lineOf(row)),price=toNum(row.price),weight=cardWeight(row);return src===null||price===null||weight===null?null:(price-src)*weight;}\r\nfunction reviewTotals(cards=draft.cardPrices){\r\n return {count:cards.length,\r\n  pieces:cards.reduce((sum,row)=>sum+(toNum(cardInfo(row)?.details?.F_PieceCount)??0),0),\r\n  weight:cards.reduce((sum,row)=>sum+(cardWeight(row)??0),0),\r\n  adjusted:cards.filter(cardAdjusted).length,\r\n  amount:cards.reduce((sum,row)=>sum+((toNum(row.price)??0)*(cardWeight(row)??0)),0),\r\n  before:cards.reduce((sum,row)=>sum+((lineSrc(lineOf(row))??0)*(cardWeight(row)??0)),0),\r\n  delta:cards.reduce((sum,row)=>sum+(cardDelta(row)??0),0)};\r\n}\r\nfunction collectReview(){\r\n const block=[],warn=[],ok=[];\r\n const lines=draft.lines,cards=draft.cardPrices;\r\n const unpriced=lines.filter(row=>lineNew(row)===null);\r\n if(unpriced.length)block.push({kind:'block',text:unpriced.map(row=>(row.F_ColorScheme||'未填色系')+'/'+(row.F_Component||'未填成份')).join('、')+' 未填新价，无法结算',jump:{type:'lines',id:unpriced[0].F_Id}});\r\n const badReason=cards.filter(row=>cardAdjusted(row)&&!priceReasons.includes(String(row.F_Reason??'').trim()));\r\n if(badReason.length)block.push({kind:'block',text:badReason.length+' 张已调价卡未填变更原因',jump:{type:'cards',id:badReason[0].F_Id}});\r\n const invalidWeight=cards.filter(row=>cardWeight(row)===null||cardWeight(row)\u003c=0);\r\n if(invalidWeight.length)block.push({kind:'block',text:'流程卡重量缺失或不大于0，不能审核',jump:{type:'cards',id:invalidWeight[0].F_Id}});\r\n const noSrc=lines.filter(row=>lineSrc(row)===null);\r\n if(noSrc.length)block.push({kind:'block',text:'原价缺失，无法计算调价幅度',jump:{type:'lines',id:noSrc[0].F_Id}});\r\n const first=lines.find(row=>lineSrc(row)!==null&&lineNew(row)!==null);\r\n const pct=first?pctOf(lineSrc(first),lineNew(first)):null;\r\n if(pct!==null&&pct\u003c=-5)warn.push({kind:'warn',text:'让价 '+fmtPct(pct)+'，超过 5% 调整阈值，需附议价依据'});\r\n if(pct!==null&&pct>=5)warn.push({kind:'warn',text:'涨价 '+fmtPct(pct)+'，超过 5% 调整阈值，需附客户确认'});\r\n const loss=toNum(draft.F_Loss);\r\n if(loss!==null&&loss\u003c2)warn.push({kind:'warn',text:'损耗 '+loss+'%，低于同类 2%~3%，需确认超损承担方'});\r\n const totals=reviewTotals(),pack=toNum(draft.F_ParkPrice);\r\n if(pack!==null&&totals.pieces&&totals.amount){\r\n  const packAmount=pack*totals.pieces,share=packAmount/totals.amount*100;\r\n  if(share>=5)warn.push({kind:'warn',text:'包装费 '+money(packAmount)+' 元，占加工费 '+share.toFixed(1)+'%，需确认是否已含在单价内'});\r\n }\r\n ok.push({kind:'ok',text:'计价单位 '+priceUnit()+'，与流程卡计重一致'});\r\n const target=lines.map(lineNew).find(value=>value!==null);\r\n if(cards.length&&target!==undefined&&cards.every(row=>toNum(row.price)===target))ok.push({kind:'ok',text:cards.length+' 张卡新价与价格明细一致'});\r\n return {block,warn,ok};\r\n}\r\nfunction flowText(){\r\n const state=workflow();\r\n const done='\u003cb class=\"done\">',now='\u003cb class=\"now\">',rej='\u003cb class=\"rejected\">',sep=' \u003cspan class=\"sep\">›\u003c/span> ';\r\n if(state==='pending')return done+'录入人已提交\u003c/b>'+sep+done+'财务已核价\u003c/b>'+sep+now+'待老板审批\u003c/b>';\r\n if(state==='approved')return done+'录入人已提交\u003c/b>'+sep+done+'财务已核价\u003c/b>'+sep+done+'老板已同意\u003c/b>';\r\n if(state==='rejected')return done+'录入人已提交\u003c/b>'+sep+done+'财务已核价\u003c/b>'+sep+rej+'老板已驳回\u003c/b>';\r\n return now+'待提交\u003c/b>'+sep+'\u003cb>老板审批未开始\u003c/b>';\r\n}\r\nfunction renderReview(){\r\n const review=collectReview(),totals=reviewTotals();\r\n const first=draft.lines.find(row=>lineSrc(row)!==null&&lineNew(row)!==null);\r\n const pct=first?pctOf(lineSrc(first),lineNew(first)):null;\r\n $('#approval-totals').innerHTML=\r\n  '\u003cspan class=\"sum\">\u003ci>调价\u003c/i>\u003cb>'+(first?lineSrc(first).toFixed(4):'—')+'\u003c/b>\u003cspan class=\"arrow\">→\u003c/span>\u003cb>'+(first?lineNew(first).toFixed(2):'—')+'\u003c/b>\u003cspan class=\"unit\">'+priceUnit()+'\u003c/span>\u003cb class=\"'+(pct===null?'':pct\u003c0?'neg':'pos')+'\">'+(pct===null?'—':fmtPct(pct))+'\u003c/b>\u003c/span>'\r\n  +'\u003cspan class=\"sum\">\u003ci>合计\u003c/i>\u003cb>'+totals.count+'\u003c/b> 张卡（调价 \u003cb>'+totals.adjusted+'\u003c/b> 张）/ \u003cb>'+totals.pieces+'\u003c/b> 匹 / \u003cb>'+fmtWeight(totals.weight)+'\u003c/b> kg\u003c/span>'\r\n  +'\u003cspan class=\"sum\">\u003ci>变更前加工费\u003c/i>\u003cb>'+money(totals.before)+'\u003c/b> 元\u003c/span>'\r\n  +'\u003cspan class=\"sum\">\u003ci>变更后加工费\u003c/i>\u003cb>'+money(totals.amount)+'\u003c/b> 元\u003c/span>'\r\n  +'\u003cspan class=\"sum\">\u003ci>增减\u003c/i>\u003cb class=\"'+(totals.delta\u003c0?'neg':totals.delta>0?'pos':'')+'\">'+money(totals.delta)+'\u003c/b> 元（'+fmtPct(totals.before?totals.delta/totals.before*100:null)+'）\u003c/span>';\r\n $('#flow').innerHTML=flowText();\r\n const canApprove=role==='boss'&&workflow()==='pending'&&!review.block.length;\r\n const approve=$('#audit-change');\r\n approve.title=review.block.length?'还有 '+review.block.length+' 项阻断：'+review.block.map(item=>item.text).join('；'):(workflow()!=='pending'?'单据不在待审核状态':(canApprove?'审核通过并结束审批':'仅老板可审核'));\r\n const reject=$('#audit-reject');\r\n reject.title=role!=='boss'?'仅老板可驳回':(workflow()!=='pending'?'单据不在待审核状态':'驳回本次调价，退回录入人修改后重新提交');\r\n const hint=$('#audit-hint');\r\n hint.textContent=review.block.length?'还有 '+review.block.length+' 项阻断未处理':'';\r\n hint.title=review.block.map(item=>item.text).join('\\n');\r\n}\r\nfunction auditNote(){return $('#audit-note').value.trim();}\r\nfunction approvePrice(){\r\n if(role!=='boss'||workflow()!=='pending')return;\r\n const review=collectReview();\r\n if(review.block.length)return showError('还有 '+review.block.length+' 项阻断，不能通过：'+review.block.map(item=>item.text).join('；')+'。');\r\n if(shipmentEntry&&!inboundEntry&&!Object.keys(approvedCardPrices(draft)).length)return showError('请核对该流程卡在来源价格明细下的价格，当前单据无法应用审核价格。');\r\n persistRecord('approved','审核','审核通过');\r\n}\r\nfunction rejectPrice(){\r\n if(role!=='boss'||workflow()!=='pending')return;\r\n persistRecord('rejected','驳回','已驳回，退回录入人修改后重新提交');\r\n}\r\nfunction withdrawPrice(){\r\n if(role!=='entry'||workflow()!=='pending')return;\r\n persistRecord('draft','撤销','已撤销提交，可继续修改后重新提交');\r\n}\r\nfunction persistRecord(nextState,action,message){\r\n let latest;\r\n try{latest=readSavedRecords()??clone(records);}catch{latest=clone(records);}\r\n const index=latest.findIndex(r=>r.F_Id===currentId),latestRecord=latest[index];\r\n if(JSON.stringify(latestRecord)!==JSON.stringify(savedRecord()))return showError('单据已在其他窗口更新，请刷新后重试。');\r\n const updated={...clone(draft),F_ChgStatus:nextState,...(shipmentEntry&&nextState==='approved'?{F_AuditedAt:Date.now()}:{})};\r\n if(index\u003c0)latest.push(updated);else latest[index]=updated;\r\n try{localStorage.setItem(storageKey,JSON.stringify({version:storageVersion,records:latest,activeId:currentId}));}catch{return showError(action+'失败：无法保存本次操作，当前内容已保留。');}\r\n rememberedId=currentId;records=latest;draft=clone(updated);newDraftBaseline=null;editing=false;\r\n renderPicker();resetChecked();renderTables();showError();status(message);syncWorkflow();\r\n if(shipmentEntry&&!inboundEntry&&nextState==='approved')sendApprovedPrice(updated,true);\r\n}\r\n$('#edit').onclick=()=>{\r\n if(!canModify()||editing||!savedRecord())return;\r\n editing=true;showError();status('正在修改');renderTables();syncWorkflow();\r\n};\r\n$('#save').onclick=()=>{if(canEdit()&&validate())persistRecord('draft','保存','已保存');};\r\n$('#submit-change').onclick=()=>{\r\n if(!canModify())return;\r\n if(!canSubmit())return showError('请先保存当前单据，再提交。');\r\n if(!validate())return;\r\n if(draft.cardPrices.some(cardAdjusted)&&!auditNote())return showError('本单存在调价卡，请先填写调价理由。',$('#audit-note'));\r\n if(shipmentEntry&&!inboundEntry&&!Object.keys(approvedCardPrices(draft)).length)return showError('请先在对应的来源价格明细下填写当前流程卡的价格。');\r\n persistRecord('pending','提交','已提交，等待老板审核');\r\n};\r\n$('#audit-change').onclick=approvePrice;\r\n$('#audit-withdraw').onclick=withdrawPrice;\r\n$('#audit-reject').onclick=rejectPrice;\r\n$('#work-role').onchange=e=>{\r\n if(hasChanges()&&(!shipmentEntry||JSON.stringify(draft)!==newDraftBaseline)){e.target.value=role;return showError('请先保存当前单据；也可关闭单据，放弃未保存的修改。');}\r\n role=e.target.value==='boss'?'boss':'entry';editing=false;resetChecked();showError();status();renderTables();syncWorkflow();\r\n};\r\nfunction loadDefaultRecord(){load((records.find(row=>row.F_Id===rememberedId)??latestContractRecord(records[0])??records[0]).F_Id);}\r\nfunction restore(){if(savedRecord())load(currentId);else loadDefaultRecord();}\r\n\r\n$('#record').onchange=()=>{const wanted=$('#record').value;if(hasChanges()&&(!shipmentEntry||JSON.stringify(draft)!==newDraftBaseline)){$('#record').value=currentId;showError('请先保存当前单据；也可关闭单据，放弃未保存的修改。');return;}load(wanted);};\r\n$('#new').onclick=()=>{\r\n if(role!=='entry')return;\r\n if((!shipmentEntry&&hasChanges())||(shipmentEntry&&JSON.stringify(draft)!==newDraftBaseline&&hasChanges())){showError('请先保存当前单据；也可关闭单据，放弃未保存的修改。');return;}\r\n if(shipmentEntry){if(shipmentContext)newShipmentDraft();return;}\r\n closeContractPicker();editing=true;currentId=uid();draft={F_Id:currentId,F_ChgStatus:'draft',F_ChgCreated:Date.now(),lines:[],fastness:[],cardPrices:[]};newDraftBaseline=JSON.stringify(draft);renderRecord();modified();$('#contract-value').focus();openContractPicker();\r\n};\r\n$('#close').onclick=()=>{if(shipmentEntry){tellShipment({type:contextMessage+'-close',revision:shipmentContext?.revision});return;}restore();$('#workspace').hidden=true;$('.toolbar').hidden=true;$('#closed').hidden=false;};\r\n$('#reopen').onclick=()=>{$('#workspace').hidden=false;$('.toolbar').hidden=false;$('#closed').hidden=true;};\r\n$('#master-form').onsubmit=e=>e.preventDefault();\r\n$('#work-role').value=role;\r\ninitCardActions();\r\nif(shipmentEntry){\r\n $('#workspace').hidden=true;\r\n $('.toolbar').hidden=true;\r\n window.addEventListener('message',event=>{\r\n  const message=event.data;\r\n  if(event.source!==window.parent||event.origin!==shipmentOrigin||message?.type!==contextMessage+'-context'||shipmentContext)return;\r\n  if(!isEffectiveApproval(message.approval)){tellShipment({type:contextMessage+'-close',revision:message.revision});return;}\r\n  shipmentContext=message;role='entry';$('#work-role').value=role;\r\n  $('#shipment-context-label').textContent=(inboundEntry?'入库单号：'+message.receiptNo:'发货单号：'+message.outNo)+'　流程卡号：'+message.card.number\r\n   +(inboundEntry&&message.approval.status?'　价格审批状态：'+message.approval.status:'');\r\n  $('#shipment-context-label').hidden=false;\r\n  $('#workspace').hidden=false;\r\n  $('.toolbar').hidden=false;\r\n  const related=records.filter(inShipment);\r\n  const latest=related.at(-1);\r\n  const lastApproved=related.filter(row=>workflow(row)==='approved').sort((a,b)=>(b.F_AuditedAt??0)-(a.F_AuditedAt??0))[0];\r\n  if(lastApproved&&!inboundEntry)sendApprovedPrice(lastApproved,false);\r\n  if(latest)load(latest.F_Id);else newShipmentDraft();\r\n });\r\n document.addEventListener('keydown',event=>{\r\n  if(event.key==='Escape'&&!event.defaultPrevented&&!document.querySelector('dialog[open]')&&!contractPicker.matches(':popover-open'))\r\n   tellShipment({type:contextMessage+'-close',revision:shipmentContext?.revision});\r\n });\r\n tellShipment({type:contextMessage+'-ready'});\r\n}else loadDefaultRecord();\r\n\r\nfunction tellShipment(message){window.parent.postMessage(message,shipmentOrigin==='null'?'*':shipmentOrigin);}\r\nfunction newShipmentDraft(){\r\n const {card,approval,currentPrices,currentPackPrices={}}=shipmentContext;\r\n editing=true;currentId=uid();\r\n draft={...Object.fromEntries(fields.map(([,key])=>[key,approval[key]??''])),F_Id:currentId,F_ApprovalId:approval.F_Id,\r\n  F_ShipCardId:card.id,F_ChgStatus:'draft',F_ChgCreated:Date.now(),\r\n  lines:approval.lines.map(row=>({...row,F_Color:row.F_Color??(approval.lines.length===1?card.details?.F_Color:'')??'',F_Id:uid(),F_SrcLineId:row.F_Id,F_PrimaryId:currentId,F_ParentId:currentId})),\r\n  fastness:(approval.fastness??[]).map(row=>({...row,F_Id:uid(),F_PrimaryId:currentId,F_ParentId:currentId})),cardPrices:[]};\r\n if(draft.lines.length===1){\r\n  const [line]=draft.lines;\r\n  draft.cardPrices.push({F_Id:uid(),parentId:line.F_Id,cardId:card.id,price:currentPrices[line.F_SrcLineId]??'',F_PackPrice:currentPackPrices[line.F_SrcLineId]??'',F_Reason:'',F_Remark:''});\r\n }\r\n newDraftBaseline=JSON.stringify(draft);renderRecord();status('正在录入');\r\n}\r\nfunction approvedCardPrices(record,key='price'){\r\n const {card,approval}=shipmentContext;\r\n const sources=new Set(approval.lines.map(row=>row.F_Id));\r\n return Object.fromEntries(record.cardPrices.flatMap(row=>{\r\n  const id=record.lines.find(line=>line.F_Id===row.parentId)?.F_SrcLineId;\r\n  return row.cardId===card.id&&sources.has(id)&&numberOK(row[key])?[[id,Number(row[key])]]:[];\r\n }));\r\n}\r\nfunction sendApprovedPrice(record,fresh){\r\n const {card,approval,revision}=shipmentContext;\r\n tellShipment({type:'shipment-price-approved',revision,cardId:card.id,approvalId:approval.F_Id,prices:approvedCardPrices(record),packPrices:approvedCardPrices(record,'F_PackPrice'),fresh});\r\n}\n\u003c/script>\n\u003c/body>\u003c/html>\n"</script></body></html>
